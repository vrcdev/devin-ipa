name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project DevinMobile.xcodeproj \
            -scheme DevinMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr DevinMobile.ipa Payload
          ls -lh DevinMobile.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DevinMobile-ipa
          path: DevinMobile.ipa
          retention-days: 30
